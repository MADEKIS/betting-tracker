<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betting Tracker · 1/4 Kelly</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0C0C0B;
    --bg2:     #141412;
    --bg3:     #1C1C1A;
    --bg4:     #232320;
    --border:  rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --border3: rgba(255,255,255,0.22);
    --text:    #F0F0EC;
    --text2:   #8A8A84;
    --text3:   #525250;
    --accent:  #D4F73E;
    --accent2: rgba(212,247,62,0.12);
    --green:   #2ECC8E;
    --red:     #FF5252;
    --amber:   #F5A623;
    --blue:    #4D9FFF;
    --radius:  6px;
    --radius-lg: 10px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg:      #FAFAF8;
      --bg2:     #FFFFFF;
      --bg3:     #F4F3EF;
      --bg4:     #ECEAE4;
      --border:  rgba(0,0,0,0.07);
      --border2: rgba(0,0,0,0.13);
      --border3: rgba(0,0,0,0.22);
      --text:    #141412;
      --text2:   #787870;
      --text3:   #BEBEB8;
      --accent:  #0057FF;
      --accent2: rgba(0,87,255,0.08);
      --green:   #1A9E6B;
      --red:     #D93B3B;
      --amber:   #B87400;
      --blue:    #0057FF;
      --radius:  6px;
      --radius-lg: 10px;
    }

    body { background: var(--bg); }

    .card {
      background: var(--bg2);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 0 0 1px var(--border);
      border: none;
    }
    .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 0 0 1px var(--border2); }

    .metric {
      background: var(--bg3);
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .metric:hover { background: var(--bg4); border-color: var(--border2); }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.primary:hover { background: #0040CC; border-color: #0040CC; opacity: 1; }

    .active-cur {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .active-cur:hover { background: #0040CC; opacity: 1; }

    .num-clickable:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    input:focus, select:focus { border-color: var(--accent); }

    .bw { background: #E8F8F1; color: #1A7A52; }
    .bl { background: #FDEAEA; color: #B02B2B; }
    .bp { background: #FEF4E2; color: #8C5800; }
    .bs { background: #E6EFFF; color: #0047CC; }

    .pill-green { background: #E8F8F1; color: #1A7A52; }
    .pill-red   { background: #FDEAEA; color: #B02B2B; }
    .pill-blue  { background: #E6EFFF; color: #0047CC; }
    .pill-gray  { background: var(--bg4); color: var(--text2); }

    .picker-btn.bw:hover { background: #E8F8F1; color: #1A7A52; }
    .picker-btn.bl:hover { background: #FDEAEA; color: #B02B2B; }
    .picker-btn.bp:hover { background: #FEF4E2; color: #8C5800; }
    .picker-btn.bs:hover { background: #E6EFFF; color: #0047CC; }

    ::-webkit-scrollbar-track { background: var(--bg3); }
    ::-webkit-scrollbar-thumb { background: var(--bg4); }
  }

  body {
    font-family: 'Outfit', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 18px;
    font-size: 14px;
    line-height: 1.5;
  }

  .container { max-width: 1120px; margin: 0 auto; }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  h2 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
  }
  p.sub { font-size: 12px; color: var(--text3); margin-top: 4px; letter-spacing: 0.02em; }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 22px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--border2); }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text2);
  }

  input, select {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  input:focus, select:focus {
    border-color: var(--accent);
    background: var(--bg4);
  }
  input::placeholder { color: var(--text3); }

  button {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text2);
    padding: 7px 14px;
    transition: all 0.15s;
    letter-spacing: 0.01em;
  }
  button:hover {
    background: var(--bg3);
    color: var(--text);
    border-color: var(--border3);
  }
  button.primary {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { opacity: 0.88; }
  button.danger { color: var(--red); border-color: rgba(255,82,82,0.3); }
  button.danger:hover { background: rgba(255,82,82,0.08); border-color: var(--red); }

  .metrics {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  @media (max-width: 700px) { .metrics { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 420px) { .metrics { grid-template-columns: repeat(2, 1fr); } }

  .metric {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
    transition: border-color 0.15s;
  }
  .metric:hover { border-color: var(--border2); }
  .metric-label {
    font-size: 10px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 700;
    margin-bottom: 7px;
  }
  .metric-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.5px;
  }
  .green { color: var(--green); }
  .red   { color: var(--red); }
  .amber { color: var(--amber); }
  .blue-t { color: var(--blue); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th {
    text-align: left;
    font-weight: 700;
    font-size: 10px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 8px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 9px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg3); }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .bw { background: rgba(46,204,142,0.12); color: #2ECC8E; }
  .bl { background: rgba(255,82,82,0.12);  color: #FF5252; }
  .bp { background: rgba(245,166,35,0.12); color: #F5A623; }
  .bs { background: rgba(77,159,255,0.12); color: #4D9FFF; }

  .num-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    display: inline-block;
    min-width: 28px;
    text-align: center;
  }
  .num-clickable {
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .num-clickable:hover {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
    transform: scale(1.15);
    box-shadow: 0 0 0 3px var(--accent2);
  }
  .num-clickable::after {
    content: '▾';
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
    white-space: nowrap;
  }
  .num-clickable:hover::after { opacity: 1; }
  td { position: relative; }
  .picker-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 10px;
    font-size: 12px;
    font-family: 'Outfit', sans-serif;
    border: none;
    border-radius: 5px;
    margin-bottom: 2px;
    cursor: pointer;
    background: transparent;
    color: var(--text2);
    transition: all 0.12s;
  }
  .picker-btn:hover { color: var(--text); background: var(--bg3); }
  .picker-btn.bw:hover { background: rgba(46,204,142,0.12); color: #2ECC8E; }
  .picker-btn.bl:hover { background: rgba(255,82,82,0.12);  color: #FF5252; }
  .picker-btn.bp:hover { background: rgba(245,166,35,0.12); color: #F5A623; }
  .picker-btn.bs:hover { background: rgba(77,159,255,0.12); color: #4D9FFF; }

  .form-grid {
    display: grid;
    grid-template-columns: 90px 60px 1.6fr 1.2fr 80px 80px 100px auto;
    gap: 8px;
    align-items: center;
  }
  @media (max-width: 800px) { .form-grid { grid-template-columns: 1fr 1fr; } }

  .overflow-x { overflow-x: auto; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-select { font-size: 12px; padding: 5px 8px; }
  .chart-wrap { position: relative; width: 100%; height: 230px; }

  .empty {
    text-align: center;
    color: var(--text3);
    padding: 32px;
    font-size: 13px;
  }

  .export-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  .rate-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text2);
    padding: 3px 0;
    gap: 16px;
  }
  .rate-row b { color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .cur-wrap { position: relative; }
  .cur-btn {
    padding: 5px 10px;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius);
    min-width: 34px;
  }
  .active-cur {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
  }
  .active-cur:hover { opacity: 0.88; background: var(--accent); }

  .day-summary { border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 8px; overflow: hidden; }
  .day-summary:last-child { margin-bottom: 0; }
  .day-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg3); cursor: pointer; user-select: none; flex-wrap: wrap; gap: 8px; transition: background 0.15s; }
  .day-header:hover { background: var(--bg4); }
  .day-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .day-pill { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .pill-green { background: rgba(46,204,142,0.12); color: #2ECC8E; }
  .pill-red   { background: rgba(255,82,82,0.12);  color: #FF5252; }
  .pill-blue  { background: rgba(77,159,255,0.12); color: #4D9FFF; }
  .pill-gray  { background: var(--bg4); color: var(--text2); border: 1px solid var(--border); }
  .day-bets-list { padding: 6px 14px 10px; }
  .day-bet-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--border); color: var(--text2); }
  .day-bet-row:last-child { border-bottom: none; }
  .day-bet-event { flex: 1.2; color: var(--text); }
  .day-bet-type  { flex: 1; }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text3);
    margin-top: 28px;
    padding-bottom: 16px;
    letter-spacing: 0.04em;
  }

  /* Accent strip on header */
  .header-accent {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: middle;
    margin-bottom: 2px;
  }

  /* Monospaced values in table */
  td b, td .green, td .red { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border3); }
</style>
</head>
<body>
<div class="container">

  <div class="header-row">
    <div>
      <h1>📊 Betting Tracker</h1>
      <p class="sub">Ординари · 1/4 Kelly · ROI-ціль 4–7%</p>
    </div>
    <div class="header-right" style="align-items:center;justify-content:flex-end">
      <span>Початковий банкрол:</span>
      <input type="number" id="startBank" value="10000" style="width:110px" onchange="save();recalc()">
      <div style="display:flex;gap:3px;margin-left:4px;position:relative" id="currencyBtns">
        <div class="cur-wrap" onmouseenter="showRateTip('UAH')" onmouseleave="hideRateTip()">
          <button onclick="setCurrency('UAH','₴')" id="btn-UAH" class="cur-btn active-cur">₴</button>
        </div>
        <div class="cur-wrap" onmouseenter="showRateTip('USD')" onmouseleave="hideRateTip()">
          <button onclick="setCurrency('USD','$')" id="btn-USD" class="cur-btn">$</button>
        </div>
        <div class="cur-wrap" onmouseenter="showRateTip('EUR')" onmouseleave="hideRateTip()">
          <button onclick="setCurrency('EUR','€')" id="btn-EUR" class="cur-btn">€</button>
        </div>
        <div id="rateTip" style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:10px 14px;min-width:170px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,0.4)">
          <div id="rateTipContent"></div>
        </div>
      </div>
      <span style="font-size:11px;color:var(--text3);opacity:0;transition:opacity 0.3s" id="saveStatus">✓ збережено</span>
    </div>
  </div>
  <div style="height:16px;display:flex;align-items:center;justify-content:flex-end;margin-bottom:8px;margin-top:-8px">
    <span style="font-size:11px;color:var(--text3)" id="saveStatusBelow"></span>
  </div>

  <div id="metrics" class="metrics"></div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      <h2 style="margin:0">Журнал ставок</h2>
      <div class="toolbar" style="margin:0">
        <select class="filter-select" id="filterResult" onchange="recalc()">
          <option value="all">Всі результати</option>
          <option value="W">Виграші</option>
          <option value="L">Програші</option>
          <option value="pending">Очікують</option>
          <option value="S">Пропуски</option>
        </select>
        <input type="text" id="filterSearch" placeholder="Пошук події..." style="font-size:12px;padding:5px 9px;width:160px" oninput="recalc()">
      </div>
    </div>
    <div class="overflow-x">
      <table>
        <thead>
          <tr>
          <th style="text-align:center;padding-left:0;padding-right:18px">#</th>
            <th>Дата</th>
            <th>Подія</th>
            <th>Ставка</th>
            <th>Коеф.</th>
            <th>Сума</th>
            <th>Результат</th>
            <th>П/З</th>
          </tr>
        </thead>
        <tbody id="betBody"></tbody>
      </table>
      <div id="emptyMsg" class="empty" style="display:none">Немає записів</div>
    </div>
  </div>

  <div class="card">
    <h2>Додати подію</h2>
    <div class="form-grid">
      <input type="text" id="iDate" placeholder="ДД.ММ.РР" value="" oninput="liveNormalizeDate(this)" onblur="liveNormalizeDate(this)" onkeydown="formEnter(event,'iTime')" onpaste="handleDatePaste(event)">
      <input type="text" id="iTime" placeholder="ГГ:ХХ" style="width:100%" onkeydown="formEnter(event,'iEvent')" onpaste="pasteAndFocus(event,'iEvent')">
      <input type="text" id="iEvent" placeholder="Подія (напр. Арсенал – Челсі)" onkeydown="formEnter(event,'iBet')" onpaste="pasteAndFocus(event,'iBet')">
      <input type="text" id="iBet" placeholder="Тип ставки" onkeydown="formEnter(event,'iOdds')" onpaste="pasteAndFocus(event,'iOdds')">
      <input type="number" id="iOdds" placeholder="Коеф." step="0.01" min="1" onkeydown="formEnter(event,'iStake')" onpaste="pasteAndFocus(event,'iStake')">
      <input type="number" id="iStake" placeholder="Сума" min="0" onkeydown="formEnterSubmit(event)" onpaste="pasteAndFocus(event,null)">
      <select id="iResult">
        <option value="pending">Очікує</option>
        <option value="W">Виграш</option>
        <option value="L">Програш</option>
        <option value="S">Пропуск</option>
      </select>
      <button class="primary" onclick="addBet()">+ Додати</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
      <h2 style="margin:0">Крива банкролу</h2>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <div style="display:flex;gap:3px" id="chartViewBtns">
          <button onclick="setChartView('bets')"   id="cv-bets"   class="cur-btn active-cur" style="font-size:12px;padding:5px 10px">Ставки</button>
          <button onclick="setChartView('days')"   id="cv-days"   class="cur-btn" style="font-size:12px;padding:5px 10px">Дні</button>
          <button onclick="setChartView('months')" id="cv-months" class="cur-btn" style="font-size:12px;padding:5px 10px">Місяці</button>
          <button onclick="setChartView('range')"  id="cv-range"  class="cur-btn" style="font-size:12px;padding:5px 10px">Діапазон</button>
        </div>
        <div id="chartRangeInputs" style="display:none;align-items:center;gap:6px">
          <input type="text" id="rangeFrom" placeholder="ДД.ММ.РР" style="width:88px;font-size:12px;padding:5px 8px">
          <span style="font-size:12px;color:var(--color-text-secondary)">—</span>
          <input type="text" id="rangeTo"   placeholder="ДД.ММ.РР" style="width:88px;font-size:12px;padding:5px 8px">
          <button onclick="applyRange()" style="font-size:12px;padding:5px 10px">OK</button>
        </div>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="bankChart"></canvas>
    </div>
  </div>

  <div class="card" id="toolsCard">
    <h2>Інструменти</h2>
    <div class="export-row">
      <button onclick="exportCSV()">⬇ Експорт CSV</button>
      <button onclick="exportJSON()">⬇ Резервна копія JSON</button>
      <button onclick="importJSON()">⬆ Відновити з JSON</button>
      <button class="danger" onclick="clearAll()">🗑 Очистити всі дані</button>
    </div>
  </div>

  <footer>Betting Tracker · дані зберігаються локально у браузері</footer>
</div>

<script>
const STORAGE_KEY = 'bettingTrackerData_v1';

let _toastTimer;
function showToast(msg) {
  let toast = document.getElementById('saveToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'saveToast';
    toast.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:8px 20px;font-size:12px;color:var(--text2);box-shadow:0 8px 32px rgba(0,0,0,0.35);z-index:9999;opacity:0;transition:opacity 0.2s,transform 0.2s;pointer-events:none;font-family:Outfit,sans-serif;white-space:nowrap;letter-spacing:0.02em';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { startBank: 10000, bets: DEFAULT_BETS, nextId: 11 };
}

let state = loadData();
let currSymbol = state.currSymbol || '₴';
let currCode   = state.currCode   || 'UAH';
document.getElementById('startBank').value = state.startBank;

let rates = { UAH: 1, USD: 0.0241, EUR: 0.0222 };
let ratesLoaded = false;

async function fetchRates() {
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/UAH');
    const data = await res.json();
    if (data && data.rates) {
      rates.USD = data.rates.USD || rates.USD;
      rates.EUR = data.rates.EUR || rates.EUR;
      rates.UAH = 1;
      ratesLoaded = true;
      recalc();
    }
  } catch(e) { /* використовуємо fallback */ }
}

function conv(uahAmount) {
  if (currCode === 'UAH') return uahAmount;
  return +(uahAmount * rates[currCode]).toFixed(2);
}

function fmtAmt(uahAmount, decimals) {
  const v = conv(uahAmount);
  return decimals !== undefined ? v.toFixed(decimals) : v.toLocaleString('uk-UA', {maximumFractionDigits: 2});
}

function pnl(b) {
  if (b.result === 'W') return +(b.stake * (b.odds - 1)).toFixed(2);
  if (b.result === 'L') return -b.stake;
  return 0;
}

function recalc() {
  const start = parseFloat(document.getElementById('startBank').value) || 10000;
  const filterR = document.getElementById('filterResult').value;
  const filterS = document.getElementById('filterSearch').value.toLowerCase();

  const settled = state.bets.filter(b => b.result === 'W' || b.result === 'L');
  const wins = settled.filter(b => b.result === 'W').length;
  const losses = settled.filter(b => b.result === 'L').length;
  const skips = state.bets.filter(b => b.result === 'S').length;
  const pending = state.bets.filter(b => b.result === 'pending').length;
  const totalPnl = +settled.reduce((s, b) => s + pnl(b), 0).toFixed(2);
  const currentBank = +(start + totalPnl).toFixed(2);
  const totalStaked = settled.reduce((s, b) => s + b.stake, 0);
  const roi = totalStaked ? +(totalPnl / totalStaked * 100).toFixed(1) : 0;
  const wr = settled.length ? +(wins / settled.length * 100).toFixed(0) : 0;
  const stakedbets = state.bets.filter(b => b.odds > 0);
  const avgOdds = stakedbets.length ? +(stakedbets.reduce((s, b) => s + b.odds, 0) / stakedbets.length).toFixed(2) : 0;

  const roiCol = roi >= 4 ? 'green' : roi >= 0 ? 'amber' : 'red';
  const pnlCol = totalPnl >= 0 ? 'green' : 'red';
  const bankCol = currentBank >= start ? 'green' : 'red';

  const dispBank  = conv(currentBank);
  const dispPnl   = conv(totalPnl);
  const dispStart = conv(start);

  // Today's date in DD.MM.YY format
  const now = new Date();
  const todayFmt = `${String(now.getDate()).padStart(2,'0')}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getFullYear()).slice(2)}`;
  const todaySettled = settled.filter(b => b.date === todayFmt);
  const todayPnl = +todaySettled.reduce((s,b) => s + pnl(b), 0).toFixed(2);
  const dispTodayPnl = conv(todayPnl);
  const todayCol = dispTodayPnl >= 0 ? 'var(--green)' : 'var(--red)';
  const todayStr2 = todaySettled.length > 0
    ? `<div style="margin-top:6px;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;font-weight:700">за ${todayFmt} <b style="color:${todayCol};font-family:'JetBrains Mono',monospace">${dispTodayPnl >= 0 ? '+' : ''}${dispTodayPnl.toFixed(currCode==='UAH'?0:2)} ${currSymbol}</b></div>`
    : '';

  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-label">Банкрол</div><div class="metric-value ${bankCol}">${dispBank.toLocaleString('uk-UA', {maximumFractionDigits:2})} ${currSymbol}</div></div>
    <div class="metric" style="cursor:default" onmouseenter="showMetricTip('pnl',this)" onmouseleave="hideMetricTip()"><div class="metric-label">Прибуток / Збиток</div><div class="metric-value ${pnlCol}">${dispPnl >= 0 ? '+' : ''}${dispPnl.toFixed(currCode==='UAH'?0:2)} ${currSymbol}</div><div style="margin-top:4px;font-size:11px;font-weight:700;color:${pnlCol};font-family:'JetBrains Mono',monospace;letter-spacing:-0.3px">${totalPnl >= 0 ? '+' : ''}${(totalPnl / start * 100).toFixed(2)}%</div>${todayStr2}</div>
    <div class="metric" style="cursor:default" onmouseenter="showMetricTip('roi',this)" onmouseleave="hideMetricTip()"><div class="metric-label">ROI</div><div class="metric-value ${roiCol}">${roi}%</div></div>
    <div class="metric" style="cursor:default" onmouseenter="showMetricTip('wlps',this)" onmouseleave="hideMetricTip()"><div class="metric-label">В / П / Оч / Пр</div><div class="metric-value">${wins}/${losses}/${pending}/${skips}</div><div style="margin-top:6px;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;font-weight:700">всього подій: <b style="color:var(--text)">${state.bets.length}</b></div></div>
    <div class="metric" style="cursor:default" onmouseenter="showMetricTip('winrate',this,${avgOdds})" onmouseleave="hideMetricTip()"><div class="metric-label">Winrate</div><div class="metric-value">${wr}%</div></div>
    <div class="metric"><div class="metric-label">Сер. коеф.</div><div class="metric-value">${avgOdds}</div></div>
  `;

  const filtered = state.bets.filter(b => {
    if (filterR !== 'all' && b.result !== filterR) return false;
    if (filterS && !b.event.toLowerCase().includes(filterS) && !b.bet.toLowerCase().includes(filterS)) return false;
    return true;
  });

  // Build ordered unique dates from ALL bets (not just filtered) for consistent coloring
  const orderedDates = [];
  state.bets.forEach(b => { if (b.date && !orderedDates.includes(b.date)) orderedDates.push(b.date); });

  if (filtered.length === 0) {
    document.getElementById('emptyMsg').style.display = 'block';
    document.getElementById('betBody').innerHTML = '';
  } else {
    document.getElementById('emptyMsg').style.display = 'none';
    document.getElementById('betBody').innerHTML = filtered.map(b => {
      const dateIdx = orderedDates.indexOf(b.date);
      const isEven  = dateIdx % 2 === 0;
      const numStyle = isEven
        ? 'background:var(--bg2);color:var(--text2);border-color:var(--border)'
        : 'background:var(--bg3);color:var(--text);border-color:var(--border2)';
      const p = pnl(b);
      const badge = b.result === 'W' ? '<span class="badge bw">Виграш</span>'
        : b.result === 'L' ? '<span class="badge bl">Програш</span>'
        : b.result === 'S' ? '<span class="badge bs">Пропуск</span>'
        : '<span class="badge bp">Очікує</span>';
      const dispP = conv(p);
      const pnlStr = (b.result === 'pending' || b.result === 'S')
        ? '<span style="color:var(--text3)">—</span>'
        : `<span class="${p >= 0 ? 'green' : 'red'}">${p >= 0 ? '+' : ''}${dispP.toFixed(currCode==='UAH'?0:2)} ${currSymbol}</span>`;
      const oddsStr = (!b.odds || b.odds === 0) ? '—' : b.odds.toFixed(2);
      const dispStake = conv(b.stake);
      const stakeStr = (!b.stake || b.stake === 0) ? '—' : `${dispStake.toFixed(currCode==='UAH'?0:2)} ${currSymbol}`;
      const numTitle = 'Натисни, щоб змінити результат';
      return `<tr id="row-${b.id}">
        <td>
          <span class="num-badge num-clickable" style="${numStyle}" title="${numTitle}" onclick="toggleResultPicker(${b.id})">${b.num}</span>
          <div id="picker-${b.id}" style="display:none;position:absolute;z-index:100;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);box-shadow:0 8px 32px rgba(0,0,0,0.4);padding:8px;min-width:130px">
            <div style="font-size:11px;color:var(--text2);margin-bottom:6px;padding:0 4px">Змінити результат:</div>
            <button class="picker-btn bw" onclick="setResult(${b.id},'W')">✓ Виграш</button>
            <button class="picker-btn bl" onclick="setResult(${b.id},'L')">✗ Програш</button>
            <button class="picker-btn bp" onclick="setResult(${b.id},'pending')">⏳ Очікує</button>
            <button class="picker-btn bs" onclick="setResult(${b.id},'S')">— Пропуск</button>
            <div style="border-top:0.5px solid var(--border);margin:6px 0"></div>
            <button class="picker-btn" style="color:var(--blue)" onclick="openEditForm(${b.id})">✎ Редагувати</button>
            <div id="del-confirm-${b.id}" style="display:none;margin-top:4px;padding:6px 4px 2px;border-top:0.5px solid var(--border)">
              <div style="font-size:11px;color:var(--text2);margin-bottom:6px">Видалити цей запис?</div>
              <div style="display:flex;gap:6px">
                <button class="picker-btn bl" style="flex:1;text-align:center" onclick="confirmRemove(${b.id})">Так</button>
                <button class="picker-btn" style="flex:1;text-align:center" onclick="document.getElementById('del-confirm-${b.id}').style.display='none'">Ні</button>
              </div>
            </div>
            <button class="picker-btn" style="color:var(--red)" onclick="document.getElementById('del-confirm-${b.id}').style.display='block';this.style.display='none'">🗑 Видалити</button>
          </div>
        </td>
        <td style="white-space:nowrap;color:var(--text2);text-align:center" onmouseenter="showDateTip(${b.id},this)" onmouseleave="hideDateTip()">${b.date}${b.time ? `<br><span style="font-size:11px;color:var(--text3)">${b.time}</span>` : ''}</td>
        <td>${b.event}</td>
        <td style="color:var(--text2)">${b.bet}</td>
        <td><b>${oddsStr}</b></td>
        <td>${stakeStr}</td>
        <td>${badge}</td>
        <td>${pnlStr}</td>
      </tr>`;
    }).join('');
  }

  renderChart(start);
}

function getDaySummary(date) {
  const dayBets = state.bets.filter(b => b.date === date);
  const staked = dayBets.filter(b => b.result === 'W' || b.result === 'L');
  if (!staked.length) return null;
  const totalStake = staked.reduce((s, b) => s + b.stake, 0);
  const totalPnlDay = +staked.reduce((s, b) => s + pnl(b), 0).toFixed(2);
  const roi = totalStake ? +(totalPnlDay / totalStake * 100).toFixed(1) : 0;
  const wins = staked.filter(b => b.result === 'W').length;
  const losses = staked.filter(b => b.result === 'L').length;
  return { totalPnlDay, roi, wins, losses, total: staked.length };
}

    </div>
  `;
  const rect = el.getBoundingClientRect();
  tip.style.display = 'block';
  const tW = tip.offsetWidth || 220;
  const tH = tip.offsetHeight || 200;
  const vW = window.innerWidth;
  const vH = window.innerHeight;

  // Prefer right of element, fallback left
  let left = rect.right + 8;
  if (left + tW > vW - 8) left = rect.left - tW - 8;
  if (left < 8) left = 8;

  // Prefer below element, flip up if no space
  let top = rect.top;
  if (top + tH > vH - 8) top = rect.bottom - tH;
  if (top < 8) top = 8;

  tip.style.left = left + 'px';
  tip.style.top  = top + 'px';
}

function showMetricTip(type, el, extra) {
  let tip = document.getElementById('metricTip');

    tip = document.createElement('div');
    tip.id = 'metricTip';

  const wins    = state.bets.filter(b => b.result==='W').length;
  const losses  = state.bets.filter(b => b.result==='L').length;
  const pending = state.bets.filter(b => b.result==='pending').length;
  const skips   = state.bets.filter(b => b.result==='S').length;

  if (type === 'pnl') {
    tip.style.minWidth = '240px'; tip.style.maxWidth = '300px';
    // group settled bets by date
    const dayMap = {};
    state.bets.filter(b => b.result==='W'||b.result==='L').forEach(b => {
      if (!dayMap[b.date]) dayMap[b.date] = 0;
      dayMap[b.date] += pnl(b);
    });
    const days = Object.keys(dayMap);
    const numDays = days.length;
    let bestDay = null, bestVal = -Infinity;
    let worstDay = null, worstVal = Infinity;
    days.forEach(d => {
      if (dayMap[d] > bestVal)  { bestVal  = dayMap[d]; bestDay  = d; }
      if (dayMap[d] < worstVal) { worstVal = dayMap[d]; worstDay = d; }
    });
    const fmt = v => { const c = conv(v); return (c>=0?'+':'')+c.toFixed(currCode==='UAH'?0:2)+' '+currSymbol; };
    const bestDisp  = bestDay  ? fmt(bestVal)  : '—';
    const worstDisp = worstDay ? fmt(worstVal) : '—';
    const bestCol  = bestVal  >= 0 ? 'var(--green)' : 'var(--red)';
    const worstCol = worstVal >= 0 ? 'var(--green)' : 'var(--red)';
    tip.innerHTML = `
      <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:10px">Прибуток / Збиток</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;gap:16px">
        <span style="color:var(--text2)">Днів у статистиці</span>
        <b style="color:var(--text)">${numDays}</b>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;gap:16px;border-top:0.5px solid var(--border);padding-top:7px">
        <span style="color:var(--text2)">Найкращий день</span>
        <span style="text-align:right"><b style="color:${bestCol}">${bestDisp}</b>${bestDay ? `<br><span style="font-size:11px;color:var(--text3)">${bestDay}</span>` : ''}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;gap:16px">
        <span style="color:var(--text2)">Найгірший день</span>
        <span style="text-align:right"><b style="color:${worstCol}">${worstDisp}</b>${worstDay ? `<br><span style="font-size:11px;color:var(--text3)">${worstDay}</span>` : ''}</span>
      </div>
    `;
  } else if (type === 'roi') {
    tip.style.minWidth = '380px'; tip.style.maxWidth = '400px';

    const activeBets = state.bets.filter(b => b.result !== 'S');
    const totalBets  = activeBets.length;
    const TARGET     = 500;
    const remaining  = Math.max(0, TARGET - totalBets);

    const daySet = new Set(activeBets.filter(b => b.date && b.date !== '—').map(b => b.date));
    const activeDays = daySet.size || 1;
    const avgPerDay  = +(totalBets / activeDays).toFixed(1);
    const daysLeft   = avgPerDay > 0 ? Math.ceil(remaining / avgPerDay) : null;

    const paceStr = daysLeft !== null
      ? `орієнтовно через ~${daysLeft} дн. при темпі ${avgPerDay} ставок/день`
      : 'недостатньо даних для розрахунку';

    // Projected bankroll at 500 bets using current daily P&L rate
    const startBank = parseFloat(document.getElementById('startBank').value) || 10000;
    const settled   = state.bets.filter(b => b.result==='W'||b.result==='L');
    const totalPnlNow = settled.reduce((s,b)=>s+pnl(b),0);
    const currentBank = startBank + totalPnlNow;
    const totalStaked = settled.reduce((s,b)=>s+b.stake,0);
    const currentROI  = totalStaked > 0 ? totalPnlNow / totalStaked : 0;
    // Estimate avg stake from settled bets
    const avgStake    = settled.length > 0 ? totalStaked / settled.length : 0;
    // Project: remaining bets × avgStake × currentROI = additional profit
    const projectedProfit = remaining * avgStake * currentROI;
    const projectedBank   = conv(currentBank + projectedProfit);
    const projBankStr     = projectedBank.toLocaleString('uk-UA', {maximumFractionDigits: 0}) + ' ' + currSymbol;
    const projCol         = projectedBank >= conv(currentBank) ? 'var(--green)' : 'var(--red)';

    tip.innerHTML = `
      <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px">ROI — Return on Investment</div>
      <div style="font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px">Показує скільки прибутку приносить кожна вкладена гривня. ROI 5% означає: на кожні 100 ₴ ставок ти заробляєш 5 ₴ чистого прибутку.</div>
      <div style="background:var(--bg2);border-radius:var(--radius);padding:8px 12px;font-size:12px">
        <div style="color:var(--text2);margin-bottom:4px">Формула:</div>
        <div style="font-family:monospace;color:var(--blue);white-space:nowrap">ROI = (Прибуток / Сума ставок) × 100%</div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px">Ціль стратегії: 4–7% ROI на дистанції 500+ ставок
        ${settled.length > 0 ? `<span style="color:${projCol};font-weight:500"> ~ ${projBankStr}</span>` : ''}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">(${paceStr})</div>
    `;
  } else if (type === 'winrate') {
    tip.style.minWidth = '380px'; tip.style.maxWidth = '400px';
    const ao = (extra && extra > 0) ? extra : 2.20;
    const breakeven = +(1 / ao * 100).toFixed(1);
    tip.innerHTML = `
      <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px">Winrate — відсоток виграшів</div>
      <div style="font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px">Показує яку частку завершених ставок ти виграв. Winrate 60% означає: з 10 ставок 6 зайшло. Не враховує пропуски та очікуючі.</div>
      <div style="background:var(--bg2);border-radius:var(--radius);padding:8px 12px;font-size:12px">
        <div style="color:var(--text2);margin-bottom:4px">Формула:</div>
        <div style="font-family:monospace;color:var(--blue);white-space:nowrap">WR = (Виграші / (Виграші + Програші)) × 100%</div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px">При сер. коеф. ${ao.toFixed(2)} беззбитковий WR ≈ ${breakeven}%</div>
    `;
  } else if (type === 'wlps') {
    tip.style.minWidth = '220px'; tip.style.maxWidth = '280px';
    tip.innerHTML = `
      <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:10px">Деталізація результатів</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;gap:12px">
        <span style="color:var(--text2)">Виграшів</span>
        <b style="color:var(--green)">${wins}</b>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;gap:12px">
        <span style="color:var(--text2)">Програшів</span>
        <b style="color:var(--red)">${losses}</b>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;gap:12px">
        <span style="color:var(--text2)">Очікують</span>
        <b style="color:var(--amber)">${pending}</b>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;border-top:0.5px solid var(--border);padding-top:7px;margin-top:2px;gap:12px">
        <span style="color:var(--text2)">Пропущених</span>
        <b style="color:var(--blue)">${skips}</b>
      </div>
    `;
  }

  const rect = el.getBoundingClientRect();
  tip.style.display = 'block';
  const tipW = tip.offsetWidth || 340;
  let left = rect.right + window.scrollX - tipW;
  if (left < 8) left = 8;
  tip.style.left = left + 'px';
  tip.style.top  = (rect.bottom + window.scrollY + 6) + 'px';
}

  if (tip) tip.style.display = 'none';
}

let chartView = 'bets';
let chartRangeFrom = null;
let chartRangeTo   = null;

function setChartView(view) {
  chartView = view;
  document.querySelectorAll('#chartViewBtns .cur-btn').forEach(b => b.classList.remove('active-cur'));
  document.getElementById(`cv-${view}`).classList.add('active-cur');
  const rangeInputs = document.getElementById('chartRangeInputs');
  rangeInputs.style.display = view === 'range' ? 'flex' : 'none';
  const start = parseFloat(document.getElementById('startBank').value) || 10000;
  renderChart(start);
}

function applyRange() {
  chartRangeFrom = document.getElementById('rangeFrom').value.trim();
  chartRangeTo   = document.getElementById('rangeTo').value.trim();
  const start = parseFloat(document.getElementById('startBank').value) || 10000;
  renderChart(start);
}

function parseShortDate(s) {
  if (!s || s === '—') return null;
  const m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if (!m) return null;
  const y = m[3].length === 2 ? '20' + m[3] : m[3];
  return new Date(`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`);
}

function renderChart(start) {
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridCol = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.07)';
  const tickCol = isDark ? '#777' : '#999';
  const settled = state.bets.filter(b => b.result === 'W' || b.result === 'L');

  let labels = [];
  let points = [];
  let col = '#1D9E75';

  if (chartView === 'bets') {
    let running = start;
    points = [conv(start)];
    labels = ['Старт'];
    meta   = [null];
    settled.forEach((b, i) => {
      running = +(running + pnl(b)).toFixed(2);
      points.push(+conv(running).toFixed(2));
      labels.push(`${i + 1}`);
      const p = pnl(b);
      const betRoi  = b.stake > 0 ? +(p / b.stake * 100).toFixed(1) : 0;
      const bankChg = +((running - start) / start * 100).toFixed(2);
      meta.push({ type:'bet', label:`#${b.num} · ${b.event}`, bet:b.bet, odds:b.odds, stake:b.stake, pnl:p, roi:betRoi, bank:running, bankChg, date:b.date, result:b.result });
    });

  } else if (chartView === 'days') {
    const dayOrder = [];
    const dayBank  = {};
    const dayStats = {};
    let running = start;
    settled.forEach(b => {
      running = +(running + pnl(b)).toFixed(2);
      const d = b.date;
      if (!dayOrder.includes(d)) dayOrder.push(d);
      dayBank[d] = running;
      if (!dayStats[d]) dayStats[d] = { wins:0, losses:0, pnl:0, stake:0 };
      dayStats[d].pnl   += pnl(b);
      dayStats[d].stake += b.stake;
      if (b.result==='W') dayStats[d].wins++;
      else dayStats[d].losses++;
    });
    dayOrder.sort((a,b) => (parseShortDate(a)||0)-(parseShortDate(b)||0));
    points = [conv(start)];
    labels = ['Старт'];
    meta   = [null];
    dayOrder.forEach(d => {
      const bk = dayBank[d];
      const s  = dayStats[d];
      const roi = s.stake > 0 ? +(s.pnl / s.stake * 100).toFixed(1) : 0;
      const bankChg = +((bk - start) / start * 100).toFixed(2);
      points.push(+conv(bk).toFixed(2));
      labels.push(d);
      meta.push({ type:'day', date:d, pnl:s.pnl, roi, wins:s.wins, losses:s.losses, bank:bk, bankChg });
    });

  } else if (chartView === 'months') {
    const monthOrder = [];
    const monthBank  = {};
    const monthStats = {};
    let running = start;
    settled.forEach(b => {
      running = +(running + pnl(b)).toFixed(2);
      const d = parseShortDate(b.date);
      if (!d) return;
      const key = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}`;
      if (!monthOrder.includes(key)) monthOrder.push(key);
      monthBank[key] = running;
      if (!monthStats[key]) monthStats[key] = { wins:0, losses:0, pnl:0, stake:0 };
      monthStats[key].pnl   += pnl(b);
      monthStats[key].stake += b.stake;
      if (b.result==='W') monthStats[key].wins++;
      else monthStats[key].losses++;
    });
    monthOrder.sort();
    points = [conv(start)];
    labels = ['Старт'];
    meta   = [null];
    monthOrder.forEach(k => {
      const [y, m] = k.split('.');
      const bk = monthBank[k];
      const s  = monthStats[k];
      const roi = s.stake > 0 ? +(s.pnl / s.stake * 100).toFixed(1) : 0;
      const bankChg = +((bk - start) / start * 100).toFixed(2);
      points.push(+conv(bk).toFixed(2));
      labels.push(`${m}.${String(y).slice(2)}`);
      meta.push({ type:'month', label:`${m}.${y}`, pnl:s.pnl, roi, wins:s.wins, losses:s.losses, bank:bk, bankChg });
    });

  } else if (chartView === 'range') {
    const fromD = parseShortDate(chartRangeFrom);
    const toD   = parseShortDate(chartRangeTo);
    let running = start;
    settled.forEach(b => { running = +(running + pnl(b)).toFixed(2); });
    // Find bankroll at start of range
    let bankAtStart = start;
    let tmp = start;
    settled.forEach(b => {
      const d = parseShortDate(b.date);
      if (fromD && d && d < fromD) { tmp = +(tmp + pnl(b)).toFixed(2); bankAtStart = tmp; }
    });
    const inRange = settled.filter(b => {
      const d = parseShortDate(b.date);
      if (!d) return false;
      if (fromD && d < fromD) return false;
      if (toD   && d > toD)   return false;
      return true;
    });
    points = [conv(bankAtStart)];
    labels = [chartRangeFrom || 'Старт'];
    meta   = [null];
    let r = bankAtStart;
    inRange.forEach((b, i) => {
      r = +(r + pnl(b)).toFixed(2);
      points.push(+conv(r).toFixed(2));
      labels.push(`${i + 1}`);
      const p = pnl(b);
      const betRoi  = b.stake > 0 ? +(p / b.stake * 100).toFixed(1) : 0;
      const bankChg = +((r - bankAtStart) / bankAtStart * 100).toFixed(2);
      meta.push({ type:'bet', label:`#${b.num} · ${b.event}`, bet:b.bet, odds:b.odds, stake:b.stake, pnl:p, roi:betRoi, bank:r, bankChg, date:b.date, result:b.result });
    });
  }

  col = points[points.length - 1] >= points[0] ? '#1D9E75' : '#E24B4A';

  function customTooltip(context) {
    let tipEl = document.getElementById('chartTip');
    if (!tipEl) {
      tipEl = document.createElement('div');
      tipEl.id = 'chartTip';
      tipEl.style.cssText = 'position:absolute;pointer-events:none;z-index:200;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:10px 14px;min-width:195px;box-shadow:0 8px 32px rgba(0,0,0,0.4);font-size:12px';
      document.getElementById('bankChart').parentElement.appendChild(tipEl);
    }
    const tt = context.tooltip;
    if (tt.opacity === 0) { tipEl.style.opacity='0'; return; }
    tipEl.style.opacity = '1';
    const idx = tt.dataPoints[0].dataIndex;
    const m   = meta[idx];
    const fmtV = v => { const c = conv(v); return (c>=0?'+':'')+c.toFixed(currCode==='UAH'?0:2)+' '+currSymbol; };
    const fmtA = v => { const c = conv(v); return c.toFixed(currCode==='UAH'?0:2)+' '+currSymbol; };
    const row  = (lbl, val, colr) => `<div style="display:flex;justify-content:space-between;gap:14px;margin-bottom:3px"><span style="color:var(--text2)">${lbl}</span><b style="color:${colr||'var(--text)'}">${val}</b></div>`;
    const sep  = () => `<div style="border-top:0.5px solid var(--border);margin:5px 0"></div>`;
    let html = '';
    if (!m) {
      html = `<div style="font-weight:500;color:var(--text);margin-bottom:6px">Старт</div>${row('Банкрол', fmtA(conv(start)))}`;
    } else if (m.type==='bet') {
      const rc = m.result==='W'?'#1D9E75':'#E24B4A';
      html = `<div style="font-weight:500;color:var(--text);margin-bottom:2px">${m.label}</div>
              <div style="color:var(--text2);margin-bottom:6px;font-size:11px">${m.bet}${m.odds>0?' @ '+m.odds.toFixed(2):''}</div>
              ${row('Результат', m.result==='W'?'Виграш':'Програш', rc)}
              ${row('Ставка', fmtA(m.stake))}
              ${row('П/З', fmtV(m.pnl), m.pnl>=0?'#1D9E75':'#E24B4A')}
              ${row('ROI ставки', (m.roi>=0?'+':'')+m.roi+'%', m.roi>=0?'#1D9E75':'#E24B4A')}
              ${sep()}
              ${row('Банкрол', fmtA(m.bank))}
              ${row('Зміна', (m.bankChg>=0?'+':'')+m.bankChg+'%', m.bankChg>=0?'#1D9E75':'#E24B4A')}`;
    } else if (m.type==='day') {
      html = `<div style="font-weight:500;color:var(--text);margin-bottom:6px">${m.date}</div>
              ${row('П/З дня', fmtV(m.pnl), m.pnl>=0?'#1D9E75':'#E24B4A')}
              ${row('ROI дня', (m.roi>=0?'+':'')+m.roi+'%', m.roi>=4?'#1D9E75':m.roi>=0?'#185FA5':'#E24B4A')}
              ${row('В / П', m.wins+'W / '+m.losses+'L')}
              ${sep()}
              ${row('Банкрол', fmtA(m.bank))}
              ${row('Зміна', (m.bankChg>=0?'+':'')+m.bankChg+'%', m.bankChg>=0?'#1D9E75':'#E24B4A')}`;
    } else if (m.type==='month') {
      html = `<div style="font-weight:500;color:var(--text);margin-bottom:6px">${m.label}</div>
              ${row('П/З місяця', fmtV(m.pnl), m.pnl>=0?'#1D9E75':'#E24B4A')}
              ${row('ROI місяця', (m.roi>=0?'+':'')+m.roi+'%', m.roi>=4?'#1D9E75':m.roi>=0?'#185FA5':'#E24B4A')}
              ${row('В / П', m.wins+'W / '+m.losses+'L')}
              ${sep()}
              ${row('Банкрол', fmtA(m.bank))}
              ${row('Зміна', (m.bankChg>=0?'+':'')+m.bankChg+'%', m.bankChg>=0?'#1D9E75':'#E24B4A')}`;
    }
    tipEl.innerHTML = html;
    const wrap = document.getElementById('bankChart').parentElement;
    const tW = tipEl.offsetWidth || 200;
    const tH = tipEl.offsetHeight || 130;
    let x = tt.caretX + 14;
    let y = tt.caretY - tH / 2;
    if (x + tW > wrap.clientWidth - 4) x = tt.caretX - tW - 14;
    if (y < 4) y = 4;
    if (y + tH > wrap.clientHeight - 4) y = wrap.clientHeight - tH - 4;
    tipEl.style.left = x + 'px';
    tipEl.style.top  = y + 'px';
  }

  if (chart) { chart.destroy(); }
  const existing = document.getElementById('chartTip');
  if (existing) existing.remove();
  document.getElementById('bankChart').parentElement.style.position = 'relative';

  chart = new Chart(document.getElementById('bankChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: points,
        borderColor: col,
        backgroundColor: col + '20',
        borderWidth: 2,
        pointRadius: chartView === 'months' ? 4 : (points.length > 40 ? 0 : 3),
        pointHoverRadius: 6,
        pointBackgroundColor: col,
        fill: true,
        tension: 0.35,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: customTooltip }
      },
      scales: {
        y: {
          grid: { color: gridCol },
          ticks: { color: tickCol, font: { size: 11 }, callback: v => `${(v/1000).toFixed(1)}k` }
        },
        x: {
          grid: { display: false },
          ticks: { color: tickCol, font: { size: 11 }, maxRotation: 30, autoSkip: true, maxTicksLimit: 12 }
        }
      }
    }
  });
}

function pasteAndFocus(e, nextId) {
  if (!nextId) return;
  setTimeout(() => document.getElementById(nextId).focus(), 0);
}

function parseStructuredPaste(text) {
  // Keys to look for (Ukrainian labels)
  const keys = ['Дата/Час','Дата','Час','Подія','Ставка','Сума','Коеф','Результат'];
  const result = {};
  // Build regex that splits on key boundaries
  const keyPattern = new RegExp('(' + keys.map(k => k.replace('/', '\\/')).join('|') + ')', 'g');
  const parts = text.split(keyPattern).map(s => s.trim()).filter(Boolean);
  // parts: [maybeJunk, key, value, key, value, ...]
  let i = 0;
  // Skip header junk like "ПолеЗначення"
  while (i < parts.length && !keys.includes(parts[i])) i++;
  while (i < parts.length - 1) {
    const key = parts[i];
    const val = parts[i + 1];
    if (keys.includes(key) && !keys.includes(val)) {
      result[key] = val;
      i += 2;
    } else {
      i++;
    }
  }
  return result;
}

function handleDatePaste(e) {
  const input = e.target;
  setTimeout(() => {
    const raw = input.value.trim();

    // Check if it looks like a structured paste (contains field labels)
    if (/Подія|Ставка|Сума|Дата/.test(raw)) {
      const data = parseStructuredPaste(raw);

      // Fill date/time
      const dateRaw = data['Дата/Час'] || data['Дата'] || '';
      if (dateRaw) {
        // Try to split date and time
        const splitRx = /^([\d.,\/\\]+)\s*[,\s]+(\d{1,2}[:.]\d{2})\s*$/;
        const sm = dateRaw.match(splitRx);
        if (sm) {
          const dp = sm[1].replace(/[,\/\\]/g,'.').replace(/\s/g,'').replace(/\.+$/,'');
          document.getElementById('iDate').value = normalizeDate(dp);
          document.getElementById('iTime').value = sm[2].replace('.', ':');
        } else {
          document.getElementById('iDate').value = normalizeDate(dateRaw.replace(/[,\/\\]/g,'.').replace(/\s/g,'').replace(/\.+$/,''));
          const timePart = data['Час'] || '';
          if (timePart) document.getElementById('iTime').value = timePart;
        }
      }

      // Fill event
      if (data['Подія']) {
        document.getElementById('iEvent').value = normalizeEvent(data['Подія']);
      }

      // Fill bet — extract odds if present "Тотал більше 2.5 @ 2.440"
      if (data['Ставка']) {
        const betRaw = data['Ставка'];
        const oddsMatch = betRaw.match(/@\s*([\d.]+)\s*$/);
        if (oddsMatch) {
          document.getElementById('iBet').value = betRaw.replace(/@\s*[\d.]+\s*$/, '').trim();
          document.getElementById('iOdds').value = parseFloat(oddsMatch[1]).toFixed(2);
        } else {
          document.getElementById('iBet').value = betRaw.trim();
        }
      }

      // Fill stake — strip non-numeric except dot
      if (data['Сума']) {
        const stakeNum = parseFloat(data['Сума'].replace(/[^\d.]/g, ''));
        if (!isNaN(stakeNum)) document.getElementById('iStake').value = stakeNum;
      }

      // Fill odds separately if provided
      if (data['Коеф']) {
        const o = parseFloat(data['Коеф'].replace(/[^\d.]/g, ''));
        if (!isNaN(o)) document.getElementById('iOdds').value = o.toFixed(2);
      }

      // Set result if provided
      if (data['Результат']) {
        const rMap = { 'виграш':'W', 'win':'W', 'програш':'L', 'loss':'L', 'пропуск':'S' };
        const rKey = data['Результат'].toLowerCase();
        const rVal = Object.keys(rMap).find(k => rKey.includes(k));
        if (rVal) document.getElementById('iResult').value = rMap[rVal];
      }

      input.value = document.getElementById('iDate').value;

      // Auto-submit if all required fields are filled
      const hasDate  = document.getElementById('iDate').value.trim();
      const hasEvent = document.getElementById('iEvent').value.trim();
      const hasOdds  = parseFloat(document.getElementById('iOdds').value) > 0;
      const hasStake = parseFloat(document.getElementById('iStake').value) > 0;

      if (hasDate && hasEvent && hasOdds && hasStake) {
        addBet();
        document.getElementById('iDate').focus();
      } else {
        document.getElementById('iEvent').focus();
      }
      return;
    }

    // Default: single date field logic
    liveNormalizeDate(input);
    if (!document.getElementById('iTime').value) {
      const val = input.value;
      if (/^\d{2}\.\d{2}\.\d{2}$/.test(val)) {
        document.getElementById('iTime').focus();
      }
    }
  }, 0);
}

function formEnter(e, nextId) {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById(nextId).focus(); }
}

function formEnterSubmit(e) {
  if (e.key === 'Enter') { e.preventDefault(); addBet(); document.getElementById('iDate').focus(); }
}

function normalizeEvent(str) {
  return str.replace(/\s*[-—]+\s*/g, ' – ').trim();
}

function liveNormalizeDate(input) {
  const raw = input.value.trim();
  if (!raw) return;

  // Step 1: try to split date from time BEFORE normalizing separators
  // Handles: "22.03.2026 18:30", "22.03.2026, 18:30", "22,03,2026, 18:30", "22/03/2026 18:30"
  // Time pattern: optional comma/space then HH:MM or HH.MM at end
  const splitRx = /^([\d.,\/\\]+)\s*[,\s]+(\d{1,2}[:.]\d{2})\s*$/;
  const splitMatch = raw.match(splitRx);

  if (splitMatch) {
    const datePart = splitMatch[1].replace(/[,\/\\]/g, '.').replace(/\s/g, '').replace(/\.+$/, '');
    const timePart = splitMatch[2].replace('.', ':');
    const normalized = normalizeDate(datePart);
    if (/^\d{2}\.\d{2}\.\d{2}$/.test(normalized)) {
      input.value = normalized;
      const timeField = document.getElementById('iTime');
      timeField.value = timePart;
      timeField.focus();
      setTimeout(() => document.getElementById('iEvent').focus(), 0);
      return;
    }
  }

  // Step 2: date only, normalize separators and year
  const dateOnly = raw.replace(/[,\/\\]/g, '.').replace(/\s/g, '');
  if (/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(dateOnly)) {
    const normalized = normalizeDate(dateOnly);
    input.value = normalized;
    setTimeout(() => input.setSelectionRange(normalized.length, normalized.length), 0);
  }
}

function normalizeDate(raw) {
  if (!raw || raw === '—') return '—';
  // already short format DD.MM.YY
  if (/^\d{2}\.\d{2}\.\d{2}$/.test(raw)) return raw;
  // DD.MM.YYYY → DD.MM.YY
  const m = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (m) return `${m[1].padStart(2,'0')}.${m[2].padStart(2,'0')}.${m[3].slice(2)}`;
  return raw;
}

function addBet() {
  const dt = normalizeDate(document.getElementById('iDate').value.trim());
  const tm = document.getElementById('iTime').value.trim() || '';
  const ev = normalizeEvent(document.getElementById('iEvent').value.trim());
  const bt = document.getElementById('iBet').value.trim();
  const od = parseFloat(document.getElementById('iOdds').value) || 0;
  const st = parseFloat(document.getElementById('iStake').value) || 0;
  const rs = document.getElementById('iResult').value;
  if (!ev) { alert('Заповни назву події'); return; }
  const newNum = state.bets.length > 0 ? Math.max(...state.bets.map(b => b.num)) + 1 : 1;
  state.bets.push({ id: state.nextId++, num: newNum, date: dt, time: tm, event: ev, bet: bt || '—', odds: od, stake: st, result: rs });
  document.getElementById('iDate').value  = '';
  document.getElementById('iTime').value  = '';
  document.getElementById('iEvent').value = '';
  document.getElementById('iBet').value   = '';
  document.getElementById('iOdds').value  = '';
  document.getElementById('iStake').value = '';
  save();
  recalc();
}

function saveEdit(id) {
  const b = state.bets.find(x => x.id === id);
  if (!b) return;
  const dt    = normalizeDate(document.getElementById('edit-date').value.trim()) || b.date;
  const tm    = document.getElementById('edit-time').value.trim();
  const ev    = normalizeEvent(document.getElementById('edit-event').value.trim());
  const bet   = document.getElementById('edit-bet').value.trim();
  const odds  = parseFloat(document.getElementById('edit-odds').value) || 0;
  const stake = parseFloat(document.getElementById('edit-stake').value) || 0;
  if (!ev) { alert('Назва події не може бути порожньою'); return; }
  b.date  = dt;
  b.time  = tm;
  b.event = ev;
  b.bet   = bet || '—';
  b.odds  = odds;
  b.stake = stake;
  document.getElementById('editOverlay').remove();
  save();
  recalc();
}

function confirmRemove(id) {
  state.bets = state.bets.filter(b => b.id !== id);
  state.bets.forEach((b, i) => { b.num = i + 1; });
  document.querySelectorAll('[id^="picker-"]').forEach(el => el.style.display = 'none');
  save();
  recalc();
}

function removeBet(id) {
  state.bets = state.bets.filter(b => b.id !== id);
  state.bets.forEach((b, i) => { b.num = i + 1; });
  document.querySelectorAll('[id^="picker-"]').forEach(el => el.style.display = 'none');
  save();
  recalc();
}

function toggleResultPicker(id) {
  const picker = document.getElementById(`picker-${id}`);
  const isOpen = picker.style.display !== 'none';
  document.querySelectorAll('[id^="picker-"]').forEach(el => el.style.display = 'none');
  document.querySelectorAll('[id^="del-confirm-"]').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.picker-btn[style*="display:none"]').forEach(el => el.style.display = '');
  if (isOpen) return;

  picker.style.display = 'block';

  const badge = picker.previousElementSibling;
  const badgeRect = badge.getBoundingClientRect();
  const pickerRect = picker.getBoundingClientRect();
  const card = document.querySelector('.card table');
  const cardRect = card ? card.closest('.card').getBoundingClientRect() : null;

  // Reset to default position first
  picker.style.top = '';
  picker.style.left = '';
  picker.style.right = '';
  picker.style.bottom = '';

  if (cardRect) {
    const pickerH = picker.offsetHeight;
    const pickerW = picker.offsetWidth;

    // Horizontal: align left to badge, clamp within card
    let left = 0;
    const tdRect = picker.parentElement.getBoundingClientRect();
    let absLeft = tdRect.left - cardRect.left;
    if (absLeft + pickerW > cardRect.width - 8) {
      absLeft = cardRect.width - pickerW - 8;
    }
    if (absLeft < 4) absLeft = 4;
    picker.style.left = absLeft + 'px';

    // Vertical: below badge by default, flip up if not enough room
    const spaceBelow = cardRect.bottom - badgeRect.bottom;
    if (spaceBelow < pickerH + 8) {
      picker.style.top = 'auto';
      picker.style.bottom = (picker.closest('td').offsetHeight) + 'px';
    }
  }
}

function setResult(id, result) {
  const bet = state.bets.find(b => b.id === id);
  if (bet) { bet.result = result; }
  document.querySelectorAll('[id^="picker-"]').forEach(el => el.style.display = 'none');
  save();
  recalc();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.num-clickable') && !e.target.closest('[id^="picker-"]')) {
    document.querySelectorAll('[id^="picker-"]').forEach(el => el.style.display = 'none');
    document.querySelectorAll('[id^="del-confirm-"]').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.picker-btn').forEach(el => el.style.display = '');
  }
});

function exportCSV() {
  const rows = [['#','Дата','Подія','Ставка','Коефіцієнт','Сума','Результат','П/З']];
  state.bets.forEach(b => {
    const p = pnl(b);
    rows.push([b.num, b.date, b.event, b.bet, b.odds || '', b.stake || '', b.result, p !== 0 ? p : '']);

  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const overlay = document.createElement('div');

    <div style="background:var(--bg);border-radius:var(--radius-lg);padding:20px;width:100%;max-width:520px;border:0.5px solid var(--border2)">

        <span style="font-size:14px;font-weight:500;color:var(--text)">Експорт CSV</span>
        <button onclick="this.closest('div[style*=fixed]').remove()" style="padding:4px 10px;font-size:12px">✕ Закрити</button>

      <textarea id="csvOut" readonly style="width:100%;height:260px;font-family:monospace;font-size:11px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);color:var(--text);padding:10px;resize:none">${csv}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button onclick="document.getElementById('csvOut').select();document.execCommand('copy');this.textContent='✓ Скопійовано!';setTimeout(()=>this.textContent='Копіювати все',1500)" style="flex:1;padding:8px">Копіювати все</button>
        <p style="font-size:11px;color:var(--text3);align-self:center">Встав у Excel або збережи як <b>.csv</b></p>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

      </div>

  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

function importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.bets) throw new Error();
        state = data;
        document.getElementById('startBank').value = state.startBank;
        save();
        recalc();
        alert('Дані відновлено успішно!');
      } catch { alert('Помилка: невалідний файл'); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function clearAll() {
  const overlay = document.createElement('div');
  overlay.id = 'clearOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.innerHTML = `
    <div style="background:var(--bg2);border-radius:var(--radius-lg);padding:24px;width:100%;max-width:360px;border:1px solid var(--border2);box-shadow:0 8px 32px rgba(0,0,0,0.4)">
      <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px">Очистити всі дані</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:18px">Введіть пароль для підтвердження. Ця дія незворотна.</div>
      <input id="clearPwd" type="password" placeholder="Пароль" style="width:100%;margin-bottom:12px" autofocus onkeydown="if(event.key==='Enter')confirmClear()">
      <div id="clearErr" style="font-size:12px;color:var(--red);margin-bottom:10px;display:none">Невірний пароль</div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button onclick="document.getElementById('clearOverlay').remove()" style="padding:8px 16px">Скасувати</button>
        <button class="danger" onclick="confirmClear()" style="padding:8px 16px">Очистити</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  setTimeout(() => document.getElementById('clearPwd').focus(), 50);
}

function confirmClear() {
  const pwd = document.getElementById('clearPwd').value;
  if (pwd !== '1727') {
    const err = document.getElementById('clearErr');
    err.style.display = 'block';
    document.getElementById('clearPwd').value = '';
    document.getElementById('clearPwd').focus();
    return;
  }
  document.getElementById('clearOverlay').remove();
  state = { startBank: 10000, bets: [], nextId: 1 };
  document.getElementById('startBank').value = 10000;
  save();
  recalc();
}

function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

initCurrency();
fetchRates();
recalc();
